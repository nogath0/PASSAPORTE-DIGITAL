spring.application.name=PASSAPORTE-DIGITAL

# Conexão com PostgreSQL do Neon
spring.datasource.url=jdbc:postgresql://ep-plain-hat-b5dx6ztd-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
